  <text x="711" y="270" text-anchor="middle" font-style="italic" font-family="Latin Modern Roman, CMU Serif, Georgia, serif" font-size="13" fill="#6E6E73">Sfj, D_jf, D_jx, PHIzg</text>

  <path d="M 429 361 L 469 361" fill="none" stroke="#6E6E73" stroke-width="1.5" marker-end="url(#arrow)"/>

