  <text x="864" y="346" text-anchor="middle" font-family="Latin Modern Roman, CMU Serif, Georgia, serif" font-size="15" fill="#FFFFFF">ss array over V<tspan font-size="11" dy="3">&#8734;</tspan></text>
  <text x="864" y="367" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#FFFFFF">build_G_*, build_P_*</text>
  <text x="864" y="386" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#FFFFFF">lpvss: build_LPV_*</text>

